<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#171a1c"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #eef1f2; }
    .tiny { font-size: 9px; }.small { font-size: 10px; }.body { font-size: 11px; }
    .label { font-size: 11px; font-weight: 700; }.heading { font-size: 13px; font-weight: 800; }
    .muted { fill: #a4adb2; }.accent { fill: #72c7d4; }.green { fill: #9be7b0; }
    .amber { fill: #ffd36a; }.red { fill: #ff9a91; font-weight: 800; }.purple { fill: #d6b8ff; }
    .webgate { fill: #ffaba5; }.mono { font-family: SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <rect width="1280" height="35" fill="#24282b"/>
  <circle cx="17" cy="18" r="5" fill="#d8ddde"/><circle cx="37" cy="18" r="5" fill="#d8ddde"/><circle cx="57" cy="18" r="5" fill="#d8ddde"/>
  <text x="73" y="22" class="label">Chrome DevTools</text><text x="181" y="22" class="small muted">portal.example.com</text>
  <rect y="35" width="1280" height="29" fill="#111416"/>
  <text x="12" y="54" class="small muted">Elements</text><text x="78" y="54" class="small muted">Console</text><text x="137" y="54" class="small muted">Sources</text>
  <text x="198" y="54" class="small muted">Network</text><text x="262" y="54" class="small muted">Application</text><text x="338" y="54" class="small muted">Security</text>
  <text x="401" y="54" class="small accent">AUTH FLOW INSPECTOR</text><rect x="399" y="61" width="128" height="2" fill="#72c7d4"/>

  <rect y="64" width="1280" height="42" fill="#202427" stroke="#343b40"/>
  <rect x="7" y="73" width="75" height="25" rx="4" fill="#17383f" stroke="#72c7d4"/><text x="17" y="90" class="small accent">Stop capture</text>
  <rect x="87" y="73" width="42" height="25" rx="4" fill="#202427" stroke="#343b40"/><text x="98" y="90" class="small">Clear</text>
  <rect x="134" y="73" width="49" height="25" rx="4" fill="#202427" stroke="#343b40"/><text x="145" y="90" class="small">Export</text>
  <rect x="188" y="73" width="118" height="25" rx="4" fill="#202427" stroke="#343b40"/><text x="199" y="90" class="small">Load From Network Tab</text>
  <rect x="311" y="73" width="88" height="25" rx="4" fill="#202427" stroke="#343b40"/><text x="321" y="90" class="small">Import HAR/JSON</text>
  <rect x="411" y="79" width="10" height="10" fill="#17383f" stroke="#72c7d4"/><text x="427" y="89" class="small accent">OAM Webgate only</text>
  <rect x="545" y="73" width="170" height="25" rx="4" fill="#171a1c" stroke="#343b40"/><text x="557" y="90" class="small muted">Find request/response text</text>
  <text x="1160" y="89" class="small muted">10 requests, 7 OAM</text>

  <rect y="106" width="468" height="694" fill="#202427"/><rect x="468" y="106" width="7" height="694" fill="#111416"/><rect x="471" y="106" width="1" height="694" fill="#4b555b"/>
  <g class="small mono">
    <rect y="107" width="468" height="38" fill="#202427"/><text x="8" y="130" class="green">GET</text><text x="62" y="130" class="green">200</text><text x="111" y="130" class="muted">96 ms</text><text x="170" y="130" class="muted">8.2 KB</text><text x="220" y="130" class="green">https://portal.example.com/protected</text>
    <rect y="145" width="468" height="38" fill="#282d30"/><text x="8" y="168" class="green">GET</text><text x="62" y="168" class="purple">302</text><text x="111" y="168" class="muted">144 ms</text><text x="170" y="168" class="muted">1.3 KB</text><text x="220" y="168" class="amber">OAM</text><text x="252" y="168" class="webgate">WebGate</text><text x="310" y="168" class="green">.../obrar.cgi</text>
    <rect y="183" width="468" height="38" fill="#282d30"/><text x="8" y="206" class="green">GET</text><text x="62" y="206" class="purple">302</text><text x="111" y="206" class="muted">173 ms</text><text x="170" y="206" class="muted">1.9 KB</text><text x="220" y="206" class="amber">OAM</text><text x="252" y="206" class="green">.../oam/server/obrareq.cgi</text>
    <rect y="221" width="468" height="38" fill="#17434a"/><text x="8" y="244" class="green">POST</text><text x="62" y="244" class="green">200</text><text x="111" y="244" class="amber">618 ms</text><text x="170" y="244" class="muted">4.4 KB</text><text x="220" y="244" class="amber">OAM</text><text x="252" y="244" class="green">.../auth_cred_submit</text>
    <rect y="259" width="468" height="38" fill="#282d30"/><text x="8" y="282" class="green">GET</text><text x="62" y="282" class="purple">302</text><text x="111" y="282" class="muted">181 ms</text><text x="170" y="282" class="muted">2.0 KB</text><text x="220" y="282" class="amber">OAM</text><text x="252" y="282" class="green">.../oam/server/obrar.cgi</text>
    <rect y="297" width="468" height="38" fill="#4c2524"/><text x="8" y="320" class="green">GET</text><text x="62" y="320" class="red">401</text><text x="111" y="320" class="red">1.84 s</text><text x="170" y="320" class="muted">3.1 KB</text><text x="220" y="320" class="amber">OAM</text><text x="252" y="320" class="webgate">WebGate</text><text x="310" y="320" class="green">.../protected</text>
  </g>

  <rect x="475" y="106" width="805" height="38" fill="#202427" stroke="#343b40"/>
  <g class="small"><text x="491" y="130">Request</text><text x="549" y="130">Response</text><text x="615" y="130">Cookies</text><rect x="662" y="112" width="84" height="28" rx="4" fill="#493813" stroke="#ffd36a"/><text x="670" y="130" class="amber">Flow Analysis</text><text x="754" y="130">Kerberos / X.509</text><text x="855" y="130">SAML XML</text><text x="913" y="130">SAML Details</text><text x="984" y="130">OAuth Token</text><text x="1052" y="130">OIDC Details</text></g>

  <text x="493" y="170" class="heading">OAM / WebGate Flow Analysis</text>
  <rect x="493" y="184" width="128" height="24" rx="4" fill="#493813" stroke="#ffd36a"/><text x="505" y="200" class="small amber">REVIEW REQUIRED</text>
  <text x="635" y="200" class="body muted">OAM session exists, but the WebGate session was not established</text>

  <rect x="493" y="222" width="236" height="94" rx="5" fill="#202427" stroke="#343b40"/><rect x="493" y="222" width="236" height="28" rx="5" fill="#4c2524"/><text x="505" y="241" class="label webgate">WEBGATE REQUEST</text>
  <text x="505" y="269" class="body muted">Endpoint</text><text x="610" y="269" class="body webgate">obrar.cgi</text><text x="505" y="291" class="body muted">Request ID</text><text x="610" y="291" class="body purple">req-2048</text>

  <rect x="740" y="222" width="254" height="94" rx="5" fill="#202427" stroke="#343b40"/><rect x="740" y="222" width="254" height="28" rx="5" fill="#493813"/><text x="752" y="241" class="label amber">OAM SERVER</text>
  <text x="752" y="269" class="body muted">Credential submit</text><text x="869" y="269" class="body green">200 OK</text><text x="752" y="291" class="body muted">OAM_ID</text><text x="869" y="291" class="body green">Established</text>

  <rect x="1005" y="222" width="251" height="94" rx="5" fill="#202427" stroke="#343b40"/><rect x="1005" y="222" width="251" height="28" rx="5" fill="#4c2524"/><text x="1017" y="241" class="label webgate">RETURN TO WEBGATE</text>
  <text x="1017" y="269" class="body muted">OAMAuthnCookie</text><text x="1133" y="269" class="body red">Missing</text><text x="1017" y="291" class="body muted">Final status</text><text x="1133" y="291" class="body red">401</text>

  <rect x="493" y="329" width="501" height="225" rx="5" fill="#202427" stroke="#343b40"/><rect x="493" y="329" width="501" height="30" rx="5" fill="#173052"/><text x="505" y="349" class="label accent">VALIDATION CHECKS</text>
  <g class="body">
    <text x="508" y="382" class="green">PASS</text><text x="570" y="382" class="label">WebGate redirect</text><text x="705" y="382" class="muted">Browser reached obrar.cgi</text>
    <line x1="505" y1="394" x2="981" y2="394" stroke="#343b40"/>
    <text x="508" y="418" class="green">PASS</text><text x="570" y="418" class="label">OAM correlation</text><text x="705" y="418" class="muted">Request ID matched across OAM redirects</text>
    <line x1="505" y1="430" x2="981" y2="430" stroke="#343b40"/>
    <text x="508" y="454" class="green">PASS</text><text x="570" y="454" class="label">OAM session</text><text x="705" y="454" class="green">OAM_ID cookie established</text>
    <line x1="505" y1="466" x2="981" y2="466" stroke="#343b40"/>
    <text x="508" y="490" class="red">FAIL</text><text x="570" y="490" class="label">WebGate session</text><text x="705" y="490" class="red">OAMAuthnCookie was not returned</text>
    <line x1="505" y1="502" x2="981" y2="502" stroke="#343b40"/>
    <text x="508" y="526" class="red">FAIL</text><text x="570" y="526" class="label">Protected resource</text><text x="705" y="526" class="red">Final browser request returned HTTP 401</text>
  </g>

  <rect x="1005" y="329" width="251" height="225" rx="5" fill="#202427" stroke="#343b40"/><rect x="1005" y="329" width="251" height="30" rx="5" fill="#352550"/><text x="1017" y="349" class="label purple">OAM / WEBGATE ARTIFACTS</text>
  <text x="1017" y="382" class="body muted">OAM_ID</text><text x="1110" y="382" class="body green">Present</text>
  <text x="1017" y="410" class="body muted">ORA_OSFS_SESSION</text><text x="1143" y="410" class="body green">Present</text>
  <text x="1017" y="438" class="body muted">OAM_REQ</text><text x="1110" y="438" class="body green">Present</text>
  <text x="1017" y="466" class="body muted">OAMAuthnCookie</text><text x="1134" y="466" class="body red">Missing</text>
  <text x="1017" y="494" class="body muted">ObSSOCookie</text><text x="1110" y="494" class="body red">Missing</text>
  <text x="1017" y="522" class="body muted">REQUEST_ID only</text><text x="1132" y="522" class="body amber">Not an OAM tag</text>

  <rect x="493" y="568" width="763" height="150" rx="5" fill="#202427" stroke="#343b40"/><rect x="493" y="568" width="763" height="30" rx="5" fill="#17383f"/><text x="505" y="588" class="label accent">CORRELATED BROWSER FLOW</text>
  <line x1="535" y1="632" x2="1208" y2="632" stroke="#4b555b" stroke-width="2"/>
  <g>
    <circle cx="535" cy="632" r="8" fill="#9be7b0"/><text x="500" y="659" class="small">Protected URL</text><text x="518" y="677" class="tiny">200</text>
    <circle cx="675" cy="632" r="8" fill="#ffaba5"/><text x="646" y="659" class="small webgate">WebGate</text><text x="660" y="677" class="tiny">302</text>
    <circle cx="815" cy="632" r="8" fill="#ffd36a"/><text x="783" y="659" class="small amber">OAM login</text><text x="800" y="677" class="tiny">200</text>
    <circle cx="955" cy="632" r="8" fill="#9be7b0"/><text x="923" y="659" class="small">OAM_ID set</text><text x="940" y="677" class="tiny">302</text>
    <circle cx="1092" cy="632" r="8" fill="#ff9a91"/><text x="1051" y="659" class="small red">WebGate cookie</text><text x="1075" y="677" class="tiny red">Missing</text>
    <circle cx="1208" cy="632" r="8" fill="#ff9a91"/><text x="1178" y="659" class="small red">Final URL</text><text x="1192" y="677" class="tiny red">401</text>
  </g>

  <rect x="493" y="731" width="763" height="50" rx="4" fill="#251f13" stroke="#8a5a00"/>
  <text x="507" y="751" class="label amber">Diagnostic interpretation</text>
  <text x="507" y="769" class="small muted">OAM authenticated the browser, but WebGate did not establish its application session. Review cookie domain/path, host routing, and WebGate/OAM logs.</text>
</svg>
