<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#171a1c"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #eef1f2; }
    .tiny { font-size: 9px; }
    .small { font-size: 10px; }
    .body { font-size: 11px; }
    .label { font-size: 11px; font-weight: 700; }
    .heading { font-size: 13px; font-weight: 800; }
    .muted { fill: #a4adb2; }
    .accent { fill: #72c7d4; }
    .green { fill: #9be7b0; }
    .amber { fill: #ffd36a; }
    .red { fill: #ff9a91; font-weight: 800; }
    .purple { fill: #d6b8ff; }
    .mono { font-family: SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <rect x="0" y="0" width="1280" height="35" fill="#24282b"/>
  <circle cx="17" cy="18" r="5" fill="#d8ddde"/><circle cx="37" cy="18" r="5" fill="#d8ddde"/><circle cx="57" cy="18" r="5" fill="#d8ddde"/>
  <text x="73" y="22" class="label">Chrome DevTools</text>
  <text x="181" y="22" class="small muted">portal.example.com</text>

  <rect x="0" y="35" width="1280" height="29" fill="#111416"/>
  <text x="12" y="54" class="small muted">Elements</text><text x="78" y="54" class="small muted">Console</text><text x="137" y="54" class="small muted">Sources</text>
  <text x="198" y="54" class="small muted">Network</text><text x="262" y="54" class="small muted">Application</text><text x="338" y="54" class="small muted">Security</text>
  <text x="401" y="54" class="small accent">OAM/SAML/OAUTH</text><rect x="399" y="61" width="103" height="2" fill="#72c7d4"/>

  <rect x="0" y="64" width="1280" height="42" fill="#202427" stroke="#343b40"/>
  <rect x="7" y="73" width="75" height="25" rx="4" fill="#17383f" stroke="#72c7d4"/><text x="17" y="90" class="small accent">Stop capture</text>
  <rect x="87" y="73" width="42" height="25" rx="4" fill="#202427" stroke="#343b40"/><text x="98" y="90" class="small">Clear</text>
  <rect x="134" y="73" width="49" height="25" rx="4" fill="#202427" stroke="#343b40"/><text x="145" y="90" class="small">Export</text>
  <rect x="188" y="73" width="118" height="25" rx="4" fill="#202427" stroke="#343b40"/><text x="199" y="90" class="small">Load From Network Tab</text>
  <rect x="311" y="73" width="88" height="25" rx="4" fill="#202427" stroke="#343b40"/><text x="321" y="90" class="small">Import HAR/JSON</text>
  <text x="421" y="89" class="small muted">SAML only</text><rect x="407" y="79" width="10" height="10" fill="none" stroke="#697175"/>
  <text x="505" y="89" class="small muted">OAM Webgate only</text><rect x="491" y="79" width="10" height="10" fill="none" stroke="#697175"/>
  <text x="618" y="89" class="small muted">Hide static</text><rect x="604" y="79" width="10" height="10" fill="none" stroke="#697175"/>
  <rect x="697" y="73" width="166" height="25" rx="4" fill="#171a1c" stroke="#343b40"/><text x="708" y="90" class="small muted">Find request/response text</text>
  <text x="1160" y="89" class="small muted">8 requests, 4 WNA</text>

  <rect x="0" y="106" width="468" height="694" fill="#202427"/>
  <rect x="468" y="106" width="7" height="694" fill="#111416"/><rect x="471" y="106" width="1" height="694" fill="#4b555b"/>

  <g class="small mono">
    <rect x="0" y="107" width="468" height="38" fill="#202427"/><text x="8" y="130" class="green">GET</text><text x="62" y="130" class="purple">302</text><text x="111" y="130" class="muted">118 ms</text><text x="170" y="130" class="muted">1.2 KB</text><text x="220" y="130" class="amber">OAM</text><text x="253" y="130" class="green">https://portal.example.com/protected</text>
    <rect x="0" y="145" width="468" height="38" fill="#282d30"/><text x="8" y="168" class="green">GET</text><text x="62" y="168" class="red">401</text><text x="111" y="168" class="muted">184 ms</text><text x="170" y="168" class="muted">620 B</text><text x="220" y="168" class="amber">OAM</text><text x="252" y="168" class="green">Kerberos</text><text x="310" y="168" class="green">.../CredCollectServlet/WNA</text>
    <rect x="0" y="183" width="468" height="38" fill="#17434a"/><text x="8" y="206" class="green">POST</text><text x="62" y="206" class="red">401</text><text x="111" y="206" class="amber">392 ms</text><text x="170" y="206" class="muted">910 B</text><text x="220" y="206" class="amber">OAM</text><text x="252" y="206" class="green">Kerberos</text><text x="310" y="206" class="red">NTLM</text><text x="347" y="206" class="green">.../WNA</text>
    <rect x="0" y="221" width="468" height="38" fill="#202427"/><text x="8" y="244" class="green">GET</text><text x="62" y="244" class="green">200</text><text x="111" y="244" class="muted">205 ms</text><text x="170" y="244" class="muted">1.3 KB</text><text x="220" y="244" class="amber">OAM</text><text x="252" y="244" class="amber">X509</text><text x="288" y="244" class="green">.../CredCollectServlet/X509</text>
    <rect x="0" y="259" width="468" height="38" fill="#282d30"/><text x="8" y="282" class="green">GET</text><text x="62" y="282" class="purple">302</text><text x="111" y="282" class="muted">166 ms</text><text x="170" y="282" class="muted">3.1 KB</text><text x="220" y="282" class="amber">OAM</text><text x="252" y="282" class="red">WebGate</text><text x="310" y="282" class="green">.../obrar.cgi</text>
    <rect x="0" y="297" width="468" height="38" fill="#202427"/><text x="8" y="320" class="green">GET</text><text x="62" y="320" class="green">200</text><text x="111" y="320" class="muted">94 ms</text><text x="170" y="320" class="muted">8.4 KB</text><text x="220" y="320" class="green">https://portal.example.com/home</text>
  </g>

  <rect x="475" y="106" width="805" height="38" fill="#202427" stroke="#343b40"/>
  <g class="small"><text x="491" y="130">Request</text><text x="549" y="130">Response</text><text x="615" y="130">Cookies</text><text x="670" y="130">Auth Info</text><text x="733" y="130">SAML XML</text><text x="797" y="130">SAML Info</text><text x="862" y="130">OAuth Info</text>
    <rect x="921" y="112" width="68" height="28" rx="4" fill="#17383f" stroke="#72c7d4"/><text x="933" y="130" class="accent">WNA Info</text><text x="1002" y="130">OIDC Info</text></g>

  <text x="493" y="170" class="heading">WNA Flow Analysis</text>
  <rect x="493" y="184" width="128" height="24" rx="4" fill="#493813" stroke="#ffd36a"/><text x="505" y="200" class="small amber">REVIEW REQUIRED</text>
  <text x="635" y="200" class="body muted">Negotiate was offered, but the browser submitted NTLM</text>

  <rect x="493" y="222" width="236" height="94" rx="5" fill="#202427" stroke="#343b40"/><rect x="493" y="222" width="236" height="28" rx="5" fill="#17383f"/><text x="505" y="241" class="label accent">CHALLENGE</text>
  <text x="505" y="269" class="body muted">HTTP status</text><text x="646" y="269" class="body red">401 Unauthorized</text><text x="505" y="291" class="body muted">WWW-Authenticate</text><text x="646" y="291" class="body green">Negotiate, NTLM</text>

  <rect x="740" y="222" width="254" height="94" rx="5" fill="#202427" stroke="#343b40"/><rect x="740" y="222" width="254" height="28" rx="5" fill="#4c2524"/><text x="752" y="241" class="label red">BROWSER RESPONSE</text>
  <text x="752" y="269" class="body muted">Authorization</text><text x="862" y="269" class="body red">NTLM token</text><text x="752" y="291" class="body muted">Expected</text><text x="862" y="291" class="body green">Negotiate / Kerberos</text>

  <rect x="1005" y="222" width="251" height="94" rx="5" fill="#202427" stroke="#343b40"/><rect x="1005" y="222" width="251" height="28" rx="5" fill="#493813"/><text x="1017" y="241" class="label amber">OAM RESULT</text>
  <text x="1017" y="269" class="body muted">WNA endpoint</text><text x="1122" y="269" class="body green">Reached</text><text x="1017" y="291" class="body muted">Final status</text><text x="1122" y="291" class="body red">401</text>

  <rect x="493" y="329" width="501" height="225" rx="5" fill="#202427" stroke="#343b40"/><rect x="493" y="329" width="501" height="30" rx="5" fill="#173052"/><text x="505" y="349" class="label accent">VALIDATION CHECKS</text>
  <g class="body">
    <text x="508" y="382" class="green">PASS</text><text x="570" y="382" class="label">WNA endpoint</text><text x="705" y="382" class="muted">/oam/CredCollectServlet/WNA reached</text>
    <line x1="505" y1="394" x2="981" y2="394" stroke="#343b40"/>
    <text x="508" y="418" class="green">PASS</text><text x="570" y="418" class="label">Challenge</text><text x="705" y="418" class="muted">Server advertised Negotiate</text>
    <line x1="505" y1="430" x2="981" y2="430" stroke="#343b40"/>
    <text x="508" y="454" class="red">FAIL</text><text x="570" y="454" class="label">Protocol</text><text x="705" y="454" class="red">Browser submitted NTLM fallback</text>
    <line x1="505" y1="466" x2="981" y2="466" stroke="#343b40"/>
    <text x="508" y="490" class="red">FAIL</text><text x="570" y="490" class="label">Final authorization</text><text x="705" y="490" class="red">WNA exchange ended with HTTP 401</text>
    <line x1="505" y1="502" x2="981" y2="502" stroke="#343b40"/>
    <text x="508" y="526" class="amber">REVIEW</text><text x="570" y="526" class="label">Session</text><text x="705" y="526" class="amber">No OAM/WebGate session cookie observed</text>
  </g>

  <rect x="1005" y="329" width="251" height="225" rx="5" fill="#202427" stroke="#343b40"/><rect x="1005" y="329" width="251" height="30" rx="5" fill="#352550"/><text x="1017" y="349" class="label purple">AUTHENTICATION ARTIFACTS</text>
  <text x="1017" y="382" class="body muted">Offered schemes</text><text x="1017" y="402" class="body green">Negotiate · NTLM</text>
  <text x="1017" y="432" class="body muted">Submitted scheme</text><text x="1017" y="452" class="body red">NTLM</text>
  <text x="1017" y="482" class="body muted">Token preview</text><text x="1017" y="502" class="body mono">TlRMTVNTUA...AAAADw==</text>
  <text x="1017" y="532" class="body muted">Token length</text><text x="1120" y="532" class="body">56 bytes</text>

  <rect x="493" y="568" width="763" height="150" rx="5" fill="#202427" stroke="#343b40"/><rect x="493" y="568" width="763" height="30" rx="5" fill="#17383f"/><text x="505" y="588" class="label accent">CAPTURED WNA FLOW</text>
  <line x1="541" y1="632" x2="1197" y2="632" stroke="#4b555b" stroke-width="2"/>
  <g>
    <circle cx="541" cy="632" r="8" fill="#9be7b0"/><text x="507" y="659" class="small">Protected URL</text><text x="522" y="677" class="tiny muted">302</text>
    <circle cx="703" cy="632" r="8" fill="#9be7b0"/><text x="669" y="659" class="small">WNA challenge</text><text x="688" y="677" class="tiny red">401</text>
    <circle cx="865" cy="632" r="8" fill="#ff9a91"/><text x="829" y="659" class="small red">NTLM fallback</text><text x="850" y="677" class="tiny red">401</text>
    <circle cx="1027" cy="632" r="8" fill="#ffd36a"/><text x="994" y="659" class="small">OAM result</text><text x="1012" y="677" class="tiny red">401</text>
    <circle cx="1197" cy="632" r="8" fill="#697175"/><text x="1162" y="659" class="small muted">Session</text><text x="1178" y="677" class="tiny muted">Not set</text>
  </g>

  <rect x="493" y="731" width="763" height="50" rx="4" fill="#251f13" stroke="#8a5a00"/>
  <text x="507" y="751" class="label amber">Browser-visible evidence only</text>
  <text x="507" y="769" class="small muted">Use klist, SPN/DNS checks, Windows events, ETW, and OAM/WebGate logs to validate ticket acquisition and server-side causes.</text>
</svg>
