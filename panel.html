<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OAM/SAML/OAUTH DevTools Panel</title>
    <link rel="stylesheet" href="panel.css">
  </head>
  <body>
    <header class="toolbar">
      <button id="captureButton" class="captureButton isCapturing" type="button">Stop capture</button>
      <button id="clearButton" type="button">Clear</button>
      <button id="exportButton" type="button">Export</button>
      <button id="loadNetworkHarButton" type="button">Load From Network Tab</button>
      <button id="importButton" class="importButton" type="button">Import HAR/JSON</button>
      <input id="importInput" type="file" accept=".json,.har,.HAR,application/json,application/x-har+json">
      <label class="toggle">
        <input id="samlOnlyInput" type="checkbox">
        <span>SAML only</span>
      </label>
      <label class="toggle">
        <input id="oamOnlyInput" type="checkbox">
        <span>OAM Webgate only</span>
      </label>
      <label class="toggle">
        <input id="hideStaticInput" type="checkbox">
        <span>Hide static</span>
      </label>
      <label class="searchFilter">
        <span>Search</span>
        <input id="searchInput" type="search" placeholder="Find request/response text">
      </label>
      <label class="hostFilter">
        <span>Hosts</span>
        <input id="oamHostInput" type="text" placeholder="login.company.com, sso.company.com">
      </label>
      <button id="scrubButton" type="button">Scrub links</button>
      <span id="summary" class="summary">0 requests</span>
      <span id="importStatus" class="importStatus"></span>
    </header>

    <main class="shell">
      <section class="requestPane" aria-label="Network traffic">
        <div id="requestList" class="requestList"></div>
      </section>

      <div id="paneDivider" class="paneDivider" role="separator" aria-label="Resize request and detail panes" aria-orientation="vertical" tabindex="0"></div>

      <section class="detailPane" aria-label="Request details">
        <nav class="tabs" aria-label="Detail tabs">
          <button class="tab isActive" type="button" data-tab="request">Request</button>
          <button class="tab" type="button" data-tab="response">Response</button>
          <button class="tab" type="button" data-tab="cookies">Cookies</button>
          <button class="tab" type="button" data-tab="flowAnalysis">Flow Analysis</button>
          <button class="tab" type="button" data-tab="authInfo">Auth Info</button>
          <button class="tab" type="button" data-tab="oamInfo">OAM Info</button>
          <button class="tab" type="button" data-tab="wnaInfo">WNA Info</button>
          <button class="tab" type="button" data-tab="saml">SAML XML</button>
          <button class="tab" type="button" data-tab="samlInfo">SAML Info</button>
          <button class="tab" type="button" data-tab="oauthInfo">OAuth Info</button>
          <button class="tab" type="button" data-tab="oidcInfo">OIDC Info</button>
          <button class="tab" type="button" data-tab="about">About</button>
        </nav>
        <div id="detailOutput" class="detailOutput">Select a request to inspect it.</div>
      </section>
    </main>

    <script src="panel.js"></script>
  </body>
</html>
